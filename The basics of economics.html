  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

.answer-input.active-input { border-color: #4a90e2; box-shadow: 0 0 3px 1px rgba(74,144,226,0.5); }\n        .questions-container { width: 100%; }\n        .part-header { background-color: #f1f2ec; padding: 15px 20px; border: 1px solid #e0e0e0; text-align: left; margin: 10px 20px; border-radius: 5px; }\n        .part-header p { margin: 0; }\n        .part-header p:first-child { margin-bottom: 5px; }\n        .timer-container { display: flex; position: relative; cursor: default; color: #333; font-size: 16px; font-weight: 500; align-items: center; }\n        .timer-controls { display: flex; align-items: center; gap: 8px; margin-left: 15px; }\n        .timer-controls button { background: #f0f0f0; border: 1px solid #ccc; border-radius: 50%; padding: 0; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }\n        .timer-controls button:hover { background: #e0e0e0; }\n        .timer-controls button svg { width: 20px; height: 20px; fill: #333; }\n        .hidden { display: none !important; }\n        .matching-form-container { display: flex; flex-direction: column; gap: 8px; }\n        .matching-form-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }\n        .matching-form-label { flex: 1; font-size: 15px; }\n        .matching-form-row.correct { background-color: #e9f7ef; padding: 8px; border-radius: 4px; }\n        .matching-form-row.incorrect { background-color: #f8d7da; padding: 8px; border-radius: 4px; }\n        .matching-form-row select.answer-input { width: 80px; text-align: center; }\n        .endings-box { background-color: #eef4fb; border: 1px solid #cfe0f5; padding: 12px 16px; border-radius: 5px; margin: 12px 0 20px; }\n        .endings-box .eb-title { font-weight: bold; margin-bottom: 8px; }\n        .endings-box p { margin: 5px 0; font-size: 15px; display: flex; gap: 10px; }\n        .endings-box .rn { font-weight: bold; min-width: 22px; color: #4a90e2; }\n        .notes-box { background-color: #f9f9f9; border: 1px solid #ddd; padding: 14px 18px; border-radius: 5px; margin: 12px 0 20px; font-size: 15px; }\n        .notes-box .nb-title { text-align: center; font-weight: bold; margin-bottom: 12px; }\n        .notes-box h5 { font-size: 15px; font-weight: bold; margin: 14px 0 6px; }\n        .notes-box ul { list-style: none; padding-left: 0; }\n        .notes-box li { margin-bottom: 8px; padding-left: 16px; position: relative; }\n        .notes-box li::before { content: '•'; position: absolute; left: 0; color: #4a90e2; }\n        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; justify-content: center; align-items: center; }\n        .modal-content { background: white; border-radius: 8px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }\n        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #333; }\n        .results-summary { font-size: 18px; margin-bottom: 20px; }\n        .results-summary p { margin-bottom: 8px; }\n        .results-details-container { display: flex; flex-direction: column; gap: 8px; }\n        .result-item { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 4px; font-size: 15px; }\n        .result-item.correct { background: #e9f7ef; }\n        .result-item.incorrect { background: #f8d7da; }\n        #goto-widget { display: flex; align-items: center; gap: 5px; }\n        #goto-input { width: 80px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }\n        #goto-btn { padding: 4px 10px; border: 1px solid #ccc; background-color: #f0f0f0; border-radius: 4px; cursor: pointer; }\n        a { color: #4a90e2; }\n        a:hover { color: #357abd; }\n    <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n    <!-- Header -->\n    <div class=\"header\">\n        <div class=\"test-info\">\n            <span><strong>IELTS Academic Reading — Passage 1<\u002Fstrong><\u002Fspan>\n            <div class=\"timer-container\">\n                <span>⏱<\u002Fspan>&nbsp;<span class=\"timer-display\">25:00<\u002Fspan>\n                <div class=\"timer-controls\">\n                    <button id=\"timer-toggle-btn\" title=\"Pause/Resume\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"><\u002Fpath><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                    <button id=\"timer-reset-btn\" title=\"Reset Timer\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"><\u002Fpath><path d=\"M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"header-icons\">\n            <div id=\"goto-widget\">\n                <label for=\"goto-input\" style=\"font-size:14px;\">Go to Q:<\u002Flabel>\n                <input type=\"number\" id=\"goto-input\" min=\"1\" max=\"15\" placeholder=\"1-15\">\n                <button id=\"goto-btn\">Go<\u002Fbutton>\n            <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Part Header -->\n    <div class=\"main-container\" id=\"main-container\">\n        <div id=\"passage-header-container\">\n            <div id=\"part-header-1\" class=\"part-header\">\n                <p><strong>Reading Passage 1<\u002Fstrong><\u002Fp>\n                <p>You should spend about 20 minutes on Questions 1–15, which are based on Reading Passage 1 below. You have 25 minutes to complete this passage.<\u002Fp>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"panels-container\">\n            <!-- PASSAGE PANEL -->\n            <div class=\"passage-panel\" id=\"passage-panel\">\n                <div id=\"passage-text-1\" class=\"reading-passage\">\n                    <h4>The Basics of Economics<\u002Fh4>\n                    <p>Economics is the study of how people use limited resources in the best possible way to meet as many of their needs and wants as they can. The word comes from a Greek phrase meaning “one who manages a household”, and the modern subject began in 1776. That year, Adam Smith, often called the “father of economics”, published <em>The Wealth of Nations<\u002Fem>. Economists have defined the subject in several ways, for example in terms of wealth, well-being, scarcity or growth. However, all of these definitions share one central idea: economics is a science of choice. It studies how people decide to use land, workers, machines and knowledge, which are all limited, to produce the goods and services they want.<\u002Fp>\n                    <p>The subject rests on two simple facts. First, human wants never end. Second, the resources needed to satisfy those wants are limited. This gap between what people want and what is available is called <em>scarcity<\u002Fem>, and it forces every person, family and country to make choices. Economists study how these choices are made, and they judge the results by asking whether resources are used without waste, whether the outcome is fair, and whether the economy stays stable.<\u002Fp>\n                    <p>Economists look at the economy at two levels. <em>Microeconomics<\u002Fem> examines the “small picture”: the decisions of individual households and firms, and how the price of a single product is set. <em>Macroeconomics<\u002Fem> examines the “big picture”: the economy of a whole country, including total income, total output, the general level of prices and unemployment. The two levels depend on each other, because the whole economy cannot be understood without understanding its parts. Economists also separate facts from opinions. <em>Positive<\u002Fem> statements describe the world as it is and can be checked against evidence, such as “The inflation rate is 12 percent.” <em>Normative<\u002Fem> statements describe how the world should be and rest on personal values, such as “The poor should pay no taxes.” Facts alone cannot prove a normative statement right or wrong. To build their theories, economists use two kinds of reasoning. <em>Inductive reasoning<\u002Fem> starts with collected facts and moves towards a general rule. <em>Deductive reasoning<\u002Fem> starts with a general assumption, forms a testable guess, and then checks that guess against real data.<\u002Fp>\n                    <p>Scarcity is the most basic problem every society faces. A resource is scarce when people would want more of it than exists if it were free. Fertile land, clean water, skilled workers and machines are all examples. Sunshine, by contrast, is a free resource, because there is more of it than people want. Economists usually group scarce resources into four types, and each earns its own reward. <em>Labour<\u002Fem> is human physical and mental effort, and its reward is wages. <em>Land<\u002Fem> covers all natural resources, and its reward is rent. <em>Capital<\u002Fem> refers to man-made tools, such as machines and roads, that are used to make other goods, and its reward is interest. <em>Entrepreneurship<\u002Fem> is the special talent of organising the other three resources, introducing new ideas and taking business risks, and its reward is profit. Scarcity should not be confused with shortage. A shortage is a temporary problem: for example, a shop runs out of rice and people cannot buy as much as they want at the current price. Scarcity is permanent and affects every society.<\u002Fp>\n                    <p>Because resources are scarce, output is limited, and not every want can be met. People must therefore choose, and every choice has a cost. This cost is known as <em>opportunity cost<\u002Fem>: the value of the next best option that is given up. A student who spends an evening studying, for instance, gives up the film she could have watched. Opportunity cost is measured by the goods or activities sacrificed, not by money.<\u002Fp>\n                    <p>Economists show these ideas with a graph called the <em>production possibilities frontier<\u002Fem> (PPF). It shows every combination of two goods that a country can produce when it uses all of its resources and technology fully. Imagine a country that makes only food and computers. It could produce 500 tonnes of food and no computers, or 2,000 computers and no food, or various mixes in between, such as 420 tonnes of food and 500 computers. Any point on the curve is possible and efficient. A point inside the curve is possible but wasteful, because some resources are left unused. A point outside the curve cannot be reached with current resources. The PPF therefore shows scarcity, choice and opportunity cost at the same time. In this example, moving from 500 to 1,000 computers reduces food output from 420 to 320 tonnes, so each extra computer costs 0.2 tonnes of food. As the country makes more and more computers, each additional computer costs more food than the one before. This is the <em>law of increasing opportunity cost<\u002Fem>. It happens because resources are specialised: farmland and farmers are well suited to growing food, but they are not well suited to building computers. A country can move its whole curve outward, and so produce more of everything, when it gains more or better resources or when its technology improves. This outward movement represents economic growth. If only one sector improves, such as farming, the curve expands on that side only.<\u002Fp>\n                    <p>Every society, whatever its system, must answer three basic questions. The first is <em>what to produce<\u002Fem>: which goods, and how much of each. The second is <em>how to produce<\u002Fem>: whether to use methods that rely mainly on workers or methods that rely mainly on machines. The third is <em>for whom to produce<\u002Fem>: how the goods should be shared among the members of society.<\u002Fp>\n                    <p>The way a society answers these questions is called its <em>economic system<\u002Fem>. In a <em>capitalist<\u002Fem>, or free-market, economy, private individuals own land and factories, and buyers and sellers decide what is produced through prices. The government’s role is small. This system is flexible, encourages new ideas and can raise living standards quickly. However, it often creates a large gap between rich and poor, and it can allow firms to harm others, for example through pollution. In a <em>command<\u002Fem>, or socialist, economy, the state owns the means of production and government planners make the main decisions. This system can reduce inequality and spread development more evenly across regions. On the other hand, it gives people little reward for hard work, limits economic freedom and tends to create heavy bureaucracy. A <em>mixed<\u002Fem> economy tries to combine the strengths of both systems. Private firms produce most goods, while the government runs key industries such as power and defence and regulates the rest. If it is poorly managed, however, a mixed economy may suffer from the weaknesses of both systems, as well as from corruption and black markets.<\u002Fp>\n                    <p>Finally, an economy can be pictured as a circle in which three groups interact. Households own resources such as labour and sell them to firms. Firms use these resources to produce goods and sell them back to households. The government collects taxes, buys goods, hires workers, and provides public services and financial support. These groups meet in two markets: the product market, where goods and services are bought and sold, and the factor market, where labour, land and capital are bought and sold. Real goods and resources flow in one direction around the circle, and money flows in the opposite direction, as households’ spending becomes firms’ revenue and firms’ payments become households’ income.<\u002Fp>\n                    <p>In short, economics exists because wants are unlimited but resources are not. This gap forces every person and every nation to choose, and every choice means giving something up.<\u002Fp>\n                <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"resizer\" id=\"resizer\"><\u002Fdiv>\n\n            <!-- QUESTIONS PANEL -->\n            <div class=\"questions-panel\" id=\"questions-panel\">\n                <div id=\"questions-1\" class=\"question-set\">\n                    <div class=\"questions-container\">\n\n                        <!-- Q1-4: Matching -->\n                        <div class=\"question\" data-q-start=\"1\" data-q-end=\"4\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 1–4<\u002Fstrong><\u002Fp>\n                                <p><em>Look at the following statements (Questions 1–6) and the list of economic systems below.<\u002Fem><\u002Fp>\n                                <p><em>Match each statement with the correct economic system, <strong>A, B or C<\u002Fstrong>.<\u002Fem><\u002Fp>\n                                <p><em>Write the correct letter, A, B or C, in boxes 1–6 on your answer sheet.<\u002Fem><\u002Fp>\n                                <p><strong>NB<\u002Fstrong>&nbsp;&nbsp;<em>You may use any letter more than once.<\u002Fem><\u002Fp>\n                            <\u002Fdiv>\n                            <div class=\"endings-box\">\n                                <p><strong>List of Economic Systems<\u002Fstrong><\u002Fp>\n                                <p><span class=\"rn\">A<\u002Fspan><span>a capitalist (free-market) economy<\u002Fspan><\u002Fp>\n                                <p><span class=\"rn\">B<\u002Fspan><span>a command (socialist) economy<\u002Fspan><\u002Fp>\n                                <p><span class=\"rn\">C<\u002Fspan><span>a mixed economy<\u002Fspan><\u002Fp>\n                            <\u002Fdiv>\n                            <div class=\"matching-form-container\">\n                                <div class=\"matching-form-row\"><label for=\"q1\" class=\"matching-form-label\"><strong>1<\u002Fstrong>&nbsp;&nbsp;Decisions about what to make are driven mainly by market prices, not by the government.<\u002Flabel><select class=\"answer-input\" id=\"q1\" style=\"width:70px\"><option value=\"\"><\u002Foption><option>A<\u002Foption><option>B<\u002Foption><option>C<\u002Foption><\u002Fselect><\u002Fdiv>\n                                <div class=\"matching-form-row\"><label for=\"q2\" class=\"matching-form-label\"><strong>2<\u002Fstrong>&nbsp;&nbsp;Factories and other productive assets are owned by the state.<\u002Flabel><select class=\"answer-input\" id=\"q2\" style=\"width:70px\"><option value=\"\"><\u002Foption><option>A<\u002Foption><option>B<\u002Foption><option>C<\u002Foption><\u002Fselect><\u002Fdiv>\n                                <div class=\"matching-form-row\"><label for=\"q3\" class=\"matching-form-label\"><strong>3<\u002Fstrong>&nbsp;&nbsp;Private businesses supply most products, while the state takes charge of a few essential sectors such as power.<\u002Flabel><select class=\"answer-input\" id=\"q3\" style=\"width:70px\"><option value=\"\"><\u002Foption><option>A<\u002Foption><option>B<\u002Foption><option>C<\u002Foption><\u002Fselect><\u002Fdiv>\n                                <div class=\"matching-form-row\"><label for=\"q4\" class=\"matching-form-label\"><strong>4<\u002Fstrong>&nbsp;&nbsp;Growth is shared out more equally across the different parts of the country.<\u002Flabel><select class=\"answer-input\" id=\"q4\" style=\"width:70px\"><option value=\"\"><\u002Foption><option>A<\u002Foption><option>B<\u002Foption><option>C<\u002Foption><\u002Fselect><\u002Fdiv>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <!-- Q5-8: TFNG -->\n                        <div class=\"question\" data-q-start=\"5\" data-q-end=\"8\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 5–8<\u002Fstrong><\u002Fp>\n                                <p><em>Do the following statements agree with the information given in Reading Passage 1?<\u002Fem><\u002Fp>\n                                <p><em>In boxes 12–15 on your answer sheet, write<\u002Fem><\u002Fp>\n                            <\u002Fdiv>\n                            <div class=\"endings-box\">\n                                <p><span class=\"rn\" style=\"min-width:90px\">TRUE<\u002Fspan><span>if the statement agrees with the information<\u002Fspan><\u002Fp>\n                                <p><span class=\"rn\" style=\"min-width:90px\">FALSE<\u002Fspan><span>if the statement contradicts the information<\u002Fspan><\u002Fp>\n                                <p><span class=\"rn\" style=\"min-width:90px\">NOT GIVEN<\u002Fspan><span>if there is no information on this<\u002Fspan><\u002Fp>\n                            <\u002Fdiv>\n                            <div class=\"matching-form-container\">\n                                <div class=\"matching-form-row\"><label for=\"q5\" class=\"matching-form-label\"><strong>5<\u002Fstrong>&nbsp;&nbsp;Adam Smith is widely seen as the person who founded economics as a subject.<\u002Flabel><select class=\"answer-input\" id=\"q5\" style=\"width:120px\"><option value=\"\"><\u002Foption><option>TRUE<\u002Foption><option>FALSE<\u002Foption><option>NOT GIVEN<\u002Foption><\u002Fselect><\u002Fdiv>\n                                <div class=\"matching-form-row\"><label for=\"q6\" class=\"matching-form-label\"><strong>6<\u002Fstrong>&nbsp;&nbsp;Sunshine is given as an example of a scarce resource.<\u002Flabel><select class=\"answer-input\" id=\"q6\" style=\"width:120px\"><option value=\"\"><\u002Foption><option>TRUE<\u002Foption><option>FALSE<\u002Foption><option>NOT GIVEN<\u002Foption><\u002Fselect><\u002Fdiv>\n                                <div class=\"matching-form-row\"><label for=\"q7\" class=\"matching-form-label\"><strong>7<\u002Fstrong>&nbsp;&nbsp;Opportunity cost is normally worked out in terms of money.<\u002Flabel><select class=\"answer-input\" id=\"q7\" style=\"width:120px\"><option value=\"\"><\u002Foption><option>TRUE<\u002Foption><option>FALSE<\u002Foption><option>NOT GIVEN<\u002Foption><\u002Fselect><\u002Fdiv>\n                                <div class=\"matching-form-row\"><label for=\"q8\" class=\"matching-form-label\"><strong>8<\u002Fstrong>&nbsp;&nbsp;Most countries in the world today operate a mixed economy.<\u002Flabel><select class=\"answer-input\" id=\"q8\" style=\"width:120px\"><option value=\"\"><\u002Foption><option>TRUE<\u002Foption><option>FALSE<\u002Foption><option>NOT GIVEN<\u002Foption><\u002Fselect><\u002Fdiv>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <!-- Q9-13: Notes -->\n                        <div class=\"question\" data-q-start=\"9\" data-q-end=\"13\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 9–13<\u002Fstrong><\u002Fp>\n                                <p><em>Complete the notes below.<\u002Fem><\u002Fp>\n                                <p><em>Choose <strong>ONE WORD ONLY<\u002Fstrong> from the passage for each answer.<\u002Fem><\u002Fp>\n                                <p><em>Write your answers in boxes 16–18 on your answer sheet.<\u002Fem><\u002Fp>\n                            <\u002Fdiv>\n                            <div class=\"notes-box\">\n                                <p class=\"nb-title\">Two levels of study, two kinds of statement and four factor of production<\u002Fp>\n                                <h5>Levels of study<\u002Fh5>\n                                <ul>\n                                    <li>The branch that looks at single households and firms and the price of one product is <strong>(9)<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q9\" placeholder=\"9\"><\u002Fli>\n                                    <li>The big-picture branch covers a nation’s income and output, the overall price level, and the rate of <strong>(10)<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q10\" placeholder=\"10\"><\u002Fli>\n                                <\u002Ful>\n                                <h5>Kinds of statement<\u002Fh5>\n                                <ul>\n                                    <li>A positive statement reports the facts and can be tested against real <strong>(11)<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q11\" placeholder=\"11\"><\u002Fli>\n                                    <li>A normative statement says how things ought to be and depends on personal values<\u002Fli>\n                                <\u002Ful>\n                                <h5>Factors of production<\u002Fh5>\n                                <p><strong>12<\u002Fstrong>&nbsp;&nbsp;<input type=\"text\" class=\"answer-input\" id=\"q12\" placeholder=\"12\"> is the type of resources that refer to equipment built by people, such as machines and roads, used to produce other goods.<\u002Fp>\n                                <p><strong>13<\u002Fstrong>&nbsp;&nbsp;<input type=\"text\" class=\"answer-input\" id=\"q13\" placeholder=\"13\"> is the ability to bring the other three resources together, come up with new ideas and shoulder the risks of business.<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <!-- Q14-15: Diagram -->\n                        <div class=\"question\" data-q-start=\"14\" data-q-end=\"15\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 14–15<\u002Fstrong><\u002Fp>\n                                <p><em>Label the diagram below.<\u002Fem><\u002Fp>\n                                <p><em>Choose <strong>ONE WORD ONLY<\u002Fstrong> from the passage for each answer.<\u002Fem><\u002Fp>\n                            <\u002Fdiv>\n                            <img src=\"992cb35e-9778-44ef-890f-633db15c2527\" alt=\"Circular flow diagram\" style=\"display:block;max-width:100%;height:auto;margin:12px 0;border:1px solid #ddd\">\n                            <div style=\"display:flex;flex-wrap:wrap;gap:24px;margin-top:8px\">\n                                <p><strong>14<\u002Fstrong>&nbsp;&nbsp;<input type=\"text\" class=\"answer-input\" id=\"q14\" placeholder=\"14\"><\u002Fp>\n                                <p><strong>15<\u002Fstrong>&nbsp;&nbsp;<input type=\"text\" class=\"answer-input\" id=\"q15\" placeholder=\"15\"><\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Bottom Nav -->\n    <nav class=\"nav-row\" id=\"nav-row\">\n        <div class=\"footer__questionWrapper___1tZ46 selected\" id=\"part-btn-1\">\n            <button class=\"footer__questionNo___3WNct\">\n                <span class=\"section-prefix\">Passage <\u002Fspan><span class=\"sectionNr\">1<\u002Fspan>\n                <span class=\"attemptedCount\">0 of 15<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"footer__subquestionWrapper___9GgoP\" id=\"sq-part-1\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"nav-arrows\">\n            <button class=\"nav-arrow\" id=\"prev-btn\" onclick=\"previousQuestion()\">←<\u002Fbutton>\n            <button class=\"nav-arrow\" id=\"next-btn\" onclick=\"nextQuestion()\">→<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"deliver-btn-wrapper\">\n            <button id=\"deliver-button\">\n                <span>Check Answers<\u002Fspan>\n            <\u002Fbutton>\n        <\u002Fdiv>\n    <\u002Fnav>\n\n    <!-- Context Menu -->\n    <div id=\"contextMenu\" class=\"context-menu\">\n        <div id=\"menu-highlight\" class=\"context-menu-item\" onclick=\"highlightText()\">Highlight<\u002Fdiv>\n        <div id=\"menu-note\" class=\"context-menu-item\" onclick=\"addNote()\">Note<\u002Fdiv>\n        <div id=\"menu-clear\" class=\"context-menu-item\" onclick=\"clearHighlight()\">Clear<\u002Fdiv>\n        <div id=\"menu-clear-all\" class=\"context-menu-item\" onclick=\"clearAllHighlights()\">Clear All<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Results Modal -->\n    <div id=\"results-modal\" class=\"modal-overlay hidden\">\n        <div class=\"modal-content\">\n            <button class=\"modal-close-btn\" onclick=\"closeResultsModal()\">×<\u002Fbutton>\n            <h2>Results — Passage 1<\u002Fh2>\n            <div class=\"results-summary\">\n                <p>Score: <span id=\"results-score\"><\u002Fspan> / 15<\u002Fp>\n                <p>Percentage: <span id=\"results-percent\"><\u002Fspan>%<\u002Fp>\n            <\u002Fdiv>\n            <div id=\"results-details\" class=\"results-details-container\"><\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <script>\n    ((fn)=>document.readyState==='loading'?document.addEventListener('DOMContentLoaded',fn):fn())(() => {\n        let currentQuestion = 1;\n        let selectedRange = null;\n        let timeInSeconds = 1500; // 25 minutes\n        let timerInterval;\n\n        const Q_START = 1;\n        const Q_END = 15;\n\n        const timerDisplay = document.querySelector('.timer-display');\n        const timerToggleButton = document.getElementById('timer-toggle-btn');\n        const timerResetButton = document.getElementById('timer-reset-btn');\n        const deliverButton = document.getElementById('deliver-button');\n        const resizer = document.getElementById('resizer');\n        const passagePanel = document.getElementById('passage-panel');\n        const questionsPanel = document.getElementById('questions-panel');\n        const contextMenu = document.getElementById('contextMenu');\n\n        const playIcon = '<svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"/><path d=\"M8 5v14l11-7L8 5z\"/><\u002Fsvg>';\n        const pauseIcon = '<svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"/><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/><\u002Fsvg>';\n\n        // ANSWERS — only show correct/incorrect, never reveal the answer\n        const correctAnswers = {\n            '1':['A'],'2':['B'],'3':['C'],'4':['B'],'5':['TRUE'],'6':['FALSE'],'7':['FALSE'],'8':['NOT GIVEN'],\n            '9':['microeconomics'],'10':['unemployment'],'11':['evidence'],'12':['capital'],'13':['entrepreneurship'],'14':['households'],'15':['revenue']\n        };\n\n        function buildSubQuestions() {\n            const container = document.getElementById('sq-part-1');\n            container.innerHTML = '';\n            for (let i = Q_START; i <= Q_END; i++) {\n                const btn = document.createElement('button');\n                btn.className = 'subQuestion';\n                btn.textContent = i;\n                btn.onclick = (ev) => { ev.stopPropagation(); goToQuestion(i); };\n                btn.id = `sq-btn-${i}`;\n                container.appendChild(btn);\n            }\n        }\n\n        function isQuestionAnswered(i) {\n            const textInput = document.querySelector(`input[type=\"text\"]#q${i}`);\n            if (textInput) return textInput.value.trim() !== '';\n            const sel = document.querySelector(`select#q${i}`);\n            if (sel) return sel.value !== '';\n            return false;\n        }\n\n        function updateAllIndicators() {\n            let count = 0;\n            for (let i = Q_START; i <= Q_END; i++) {\n                if (isQuestionAnswered(i)) count++;\n                const btn = document.getElementById(`sq-btn-${i}`);\n                if (btn) {\n                    btn.classList.toggle('answered', isQuestionAnswered(i));\n                    btn.classList.toggle('active', i === currentQuestion);\n                }\n            }\n            const wrapper = document.getElementById('part-btn-1');\n            if (wrapper) {\n                const span = wrapper.querySelector('.attemptedCount');\n                if (span) span.textContent = `${count} of ${Q_END - Q_START + 1}`;\n            }\n        }\n\n        function goToQuestion(qNum) {\n            currentQuestion = qNum;\n            const targetEl = document.getElementById(`q${qNum}`);\n            if (targetEl) {\n                const row = targetEl.closest('.matching-form-row') || targetEl.closest('li') || targetEl;\n                const containerRect = questionsPanel.getBoundingClientRect();\n                const rowRect = row.getBoundingClientRect();\n                questionsPanel.scrollTop += rowRect.top - containerRect.top - 90;\n            }\n\n            document.querySelectorAll('.answer-input.active-input').forEach(el => el.classList.remove('active-input'));\n            const activeInput = document.getElementById(`q${qNum}`);\n            if (activeInput) activeInput.classList.add('active-input');\n\n            updateAllIndicators();\n            updateNavArrows();\n        }\n\n        function nextQuestion() { if (currentQuestion < Q_END) goToQuestion(currentQuestion + 1); }\n        function previousQuestion() { if (currentQuestion > Q_START) goToQuestion(currentQuestion - 1); }\n\n        function updateNavArrows() {\n            document.getElementById('prev-btn').disabled = currentQuestion <= Q_START;\n            document.getElementById('next-btn').disabled = currentQuestion >= Q_END;\n        }\n\n        function updateTimerDisplay() {\n            const m = Math.floor(timeInSeconds / 60);\n            const s = timeInSeconds % 60;\n            timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;\n        }\n\n        function startTimer() {\n            if (timerInterval) clearInterval(timerInterval);\n            timerInterval = setInterval(() => {\n                timeInSeconds--;\n                updateTimerDisplay();\n                if (timeInSeconds <= 0) {\n                    clearInterval(timerInterval);\n                    timerDisplay.textContent = \"Time's up!\";\n                }\n            }, 1000);\n            timerToggleButton.innerHTML = pauseIcon;\n        }\n\n        function pauseTimer() {\n            clearInterval(timerInterval);\n            timerToggleButton.innerHTML = playIcon;\n        }\n\n        function toggleTimer() {\n            if (timerToggleButton.innerHTML.includes('M6 19h4V5H6v14z')) pauseTimer();\n            else startTimer();\n        }\n\n        function resetTimer() {\n            timeInSeconds = 1500;\n            updateTimerDisplay();\n            startTimer();\n        }\n\n        // CHECK ANSWERS — only show correct/incorrect, never reveal the answer\n        function checkAnswers() {\n            document.querySelectorAll('input, select, textarea').forEach(inp => inp.disabled = true);\n            deliverButton.disabled = true;\n            deliverButton.style.cursor = 'not-allowed';\n            clearInterval(timerInterval);\n\n            let score = 0;\n            const resultsDetails = document.getElementById('results-details');\n            resultsDetails.innerHTML = '';\n\n            document.querySelectorAll('.correct, .incorrect').forEach(el => {\n                el.classList.remove('correct', 'incorrect');\n            });\n\n            for (let i = Q_START; i <= Q_END; i++) {\n                const accepted = correctAnswers[String(i)] || [];\n                let userAnswer = '';\n                let isCorrect = false;\n\n                const textEl = document.querySelector(`input[type=\"text\"]#q${i}`);\n                const selEl = document.querySelector(`select#q${i}`);\n\n                if (textEl) {\n                    userAnswer = textEl.value.trim();\n                    isCorrect = accepted.some(a => userAnswer.toLowerCase() === a.toLowerCase());\n                } else if (selEl) {\n                    userAnswer = selEl.value;\n                    isCorrect = accepted.includes(userAnswer);\n                    const row = selEl.closest('.matching-form-row');\n                    if (row) row.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n\n                if (isCorrect) score++;\n\n                const btn = document.getElementById(`sq-btn-${i}`);\n                if (btn) {\n                    btn.classList.remove('answered');\n                    btn.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n\n                const item = document.createElement('div');\n                item.className = `result-item ${isCorrect ? 'correct' : 'incorrect'}`;\n                item.innerHTML = `<span>Q${i}: ${userAnswer || 'Not Answered'}<\u002Fspan><span>${isCorrect ? '✔ Correct' : '✖ Incorrect'}<\u002Fspan>`;\n                resultsDetails.appendChild(item);\n            }\n\n            const total = Q_END - Q_START + 1;\n            document.getElementById('results-score').textContent = score;\n            document.getElementById('results-percent').textContent = Math.round((score / total) * 100);\n            document.getElementById('results-modal').classList.remove('hidden');\n        }\n\n        function closeResultsModal() {\n            document.getElementById('results-modal').classList.add('hidden');\n        }\n\n        function initializeContextMenu() {\n            const panels = [passagePanel, questionsPanel];\n\n            document.addEventListener('selectionchange', () => {\n                const sel = window.getSelection();\n                if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {\n                    const range = sel.getRangeAt(0);\n                    if (panels.some(p => p.contains(range.commonAncestorContainer))) {\n                        selectedRange = range;\n                    }\n                }\n            });\n\n            const showMenu = (e) => {\n                const target = e.target;\n                const onHL = target.closest('.highlight, .comment-highlight');\n                const hasSelection = selectedRange && selectedRange.toString().trim().length > 0;\n                let show = false;\n                if (onHL) {\n                    document.getElementById('menu-highlight').style.display = 'none';\n                    document.getElementById('menu-note').style.display = 'none';\n                    document.getElementById('menu-clear').style.display = 'block';\n                    document.getElementById('menu-clear-all').style.display = 'block';\n                    contextMenu.targetElementForClear = onHL;\n                    show = true;\n                } else if (hasSelection && panels.some(p => p.contains(selectedRange.commonAncestorContainer))) {\n                    document.getElementById('menu-highlight').style.display = 'flex';\n                    document.getElementById('menu-note').style.display = 'flex';\n                    document.getElementById('menu-clear').style.display = 'none';\n                    document.getElementById('menu-clear-all').style.display = 'block';\n                    show = true;\n                }\n                if (show) {\n                    e.preventDefault();\n                    contextMenu.style.display = 'block';\n                    const mh = contextMenu.offsetHeight, mw = contextMenu.offsetWidth;\n                    let left = e.pageX, top = e.pageY - mh - 5;\n                    if (left + mw > window.innerWidth) left = window.innerWidth - mw - 5;\n                    if (top < 0) top = e.pageY + 5;\n                    contextMenu.style.left = `${left}px`;\n                    contextMenu.style.top = `${top}px`;\n                }\n            };\n\n            panels.forEach(p => p.addEventListener('contextmenu', showMenu));\n            document.addEventListener('click', (e) => {\n                if (contextMenu.style.display === 'block' && !contextMenu.contains(e.target)) closeContextMenu();\n            });\n        }\n\n        function closeContextMenu() {\n            contextMenu.style.display = 'none';\n            selectedRange = null;\n        }\n\n        function unwrapElement(el) {\n            const parent = el.parentNode;\n            if (!parent) return;\n            while (el.firstChild) parent.insertBefore(el.firstChild, el);\n            parent.removeChild(el);\n            parent.normalize();\n        }\n\n        window.highlightText = () => {\n            if (selectedRange && !selectedRange.collapsed) {\n                const selectedContent = selectedRange.extractContents();\n                const span = document.createElement('span');\n                span.className = 'highlight';\n                span.appendChild(selectedContent);\n                selectedRange.insertNode(span);\n            }\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.addNote = () => {\n            const note = prompt('Enter your note:');\n            if (!note || !selectedRange || selectedRange.collapsed) {\n                closeContextMenu();\n                window.getSelection().removeAllRanges();\n                return;\n            }\n            const span = document.createElement('span');\n            span.className = 'comment-highlight';\n            const tooltip = document.createElement('span');\n            tooltip.className = 'comment-tooltip';\n            tooltip.textContent = note;\n            span.appendChild(selectedRange.extractContents());\n            span.appendChild(tooltip);\n            selectedRange.insertNode(span);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.clearHighlight = () => {\n            const el = contextMenu.targetElementForClear;\n            if (el) unwrapElement(el);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.clearAllHighlights = () => {\n            document.querySelectorAll('.highlight, .comment-highlight').forEach(unwrapElement);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        function initResize(e) {\n            e.preventDefault();\n            const startX = e.clientX;\n            const startWidth = passagePanel.offsetWidth;\n            const doDrag = (e) => {\n                const nw = startWidth + e.clientX - startX;\n                if (nw > 200 && (document.body.clientWidth - nw - resizer.offsetWidth) > 200) {\n                    passagePanel.style.flex = `0 0 ${nw}px`;\n                }\n            };\n            const stopDrag = () => {\n                window.removeEventListener('mousemove', doDrag);\n                window.removeEventListener('mouseup', stopDrag);\n            };\n            window.addEventListener('mousemove', doDrag);\n            window.addEventListener('mouseup', stopDrag);\n        }\n\n        document.getElementById('goto-btn').addEventListener('click', () => {\n            const val = parseInt(document.getElementById('goto-input').value);\n            if (val >= Q_START && val <= Q_END) goToQuestion(val);\n        });\n        document.getElementById('goto-input').addEventListener('keydown', (e) => {\n            if (e.key === 'Enter') document.getElementById('goto-btn').click();\n        });\n\n        window.nextQuestion = nextQuestion;\n        window.previousQuestion = previousQuestion;\n        window.goToQuestion = goToQuestion;\n        window.closeResultsModal = closeResultsModal;\n\n        function initialize() {\n            buildSubQuestions();\n            startTimer();\n            updateAllIndicators();\n            updateNavArrows();\n            resizer.addEventListener('mousedown', initResize);\n            initializeContextMenu();\n            document.body.addEventListener('input', updateAllIndicators);\n            document.body.addEventListener('change', updateAllIndicators);\n            deliverButton.addEventListener('click', checkAnswers);\n            timerToggleButton.addEventListener('click', toggleTimer);\n            timerResetButton.addEventListener('click', resetTimer);\n            document.querySelectorAll('.matching-form-row').forEach(row => {\n                row.addEventListener('click', (e) => {\n                    if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;\n                    const sel = row.querySelector('select');\n                    if (sel) {\n                        const q = parseInt(sel.id.replace('q', ''));\n                        if (currentQuestion !== q) goToQuestion(q);\n                    }\n                });\n            });\n        }\n\n        initialize();\n    });\n    <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
