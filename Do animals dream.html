  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

    .answer-input.active-input { border-color: #4a90e2; box-shadow: 0 0 3px 1px rgba(74,144,226,0.5); }\n        .questions-container { width: 100%; }\n        .part-header { background-color: #f1f2ec; padding: 15px 20px; border: 1px solid #e0e0e0; text-align: left; margin: 10px 20px; border-radius: 5px; }\n        .part-header p { margin: 0; }\n        .part-header p:first-child { margin-bottom: 5px; }\n        .timer-container { display: flex; position: relative; cursor: default; color: #333; font-size: 16px; font-weight: 500; align-items: center; }\n        .timer-controls { display: flex; align-items: center; gap: 8px; margin-left: 15px; }\n        .timer-controls button { background: #f0f0f0; border: 1px solid #ccc; border-radius: 50%; padding: 0; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }\n        .timer-controls button:hover { background: #e0e0e0; }\n        .timer-controls button svg { width: 20px; height: 20px; fill: #333; }\n        .hidden { display: none !important; }\n        .tf-question { margin-bottom: 25px; padding: 10px 0px; border-radius: 4px; transition: background-color 0.3s; }\n        .tf-question-line { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }\n        .tf-question-number { font-weight: bold; min-width: 25px; color: #4a90e2; }\n        .tf-question-text { flex: 1; }\n        .tf-options { display: flex; gap: 15px; flex-wrap: wrap; margin-left: 35px; }\n        .tf-option { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 15px; }\n        .tf-option input { accent-color: #4a90e2; transform: scale(1.2); }\n        .tf-question.correct { background-color: #e9f7ef; border-left: 4px solid #28a745; padding-left: 6px; }\n        .tf-question.incorrect { background-color: #f8d7da; border-left: 4px solid #dc3545; padding-left: 6px; }\n        .table-completion { width: 100%; border-collapse: collapse; margin: 12px 0 20px; font-size: 15px; }\n        .table-completion th, .table-completion td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; vertical-align: top; }\n        .table-completion th { background-color: #f1f2ec; font-weight: bold; }\n        .table-completion td input.answer-input { width: 110px; }\n        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; justify-content: center; align-items: center; }\n        .modal-content { background: white; border-radius: 8px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }\n        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #333; }\n        .results-summary { font-size: 18px; margin-bottom: 20px; }\n        .results-summary p { margin-bottom: 8px; }\n        .results-details-container { display: flex; flex-direction: column; gap: 8px; }\n        .result-item { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 4px; font-size: 15px; }\n        .result-item.correct { background: #e9f7ef; }\n        .result-item.incorrect { background: #f8d7da; }\n        #goto-widget { display: flex; align-items: center; gap: 5px; }\n        #goto-input { width: 80px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }\n        #goto-btn { padding: 4px 10px; border: 1px solid #ccc; background-color: #f0f0f0; border-radius: 4px; cursor: pointer; }\n    <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n    <!-- Header -->\n    <div class=\"header\">\n        <div class=\"test-info\">\n            <span><strong>IELTS Academic Reading — Passage 1<\u002Fstrong><\u002Fspan>\n            <div class=\"timer-container\">\n                <span>⏱<\u002Fspan>&nbsp;<span class=\"timer-display\">25:00<\u002Fspan>\n                <div class=\"timer-controls\">\n                    <button id=\"timer-toggle-btn\" title=\"Pause/Resume\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"><\u002Fpath><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                    <button id=\"timer-reset-btn\" title=\"Reset Timer\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"><\u002Fpath><path d=\"M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"header-icons\">\n            <div id=\"goto-widget\">\n                <label for=\"goto-input\" style=\"font-size:14px;\">Go to Q:<\u002Flabel>\n                <input type=\"number\" id=\"goto-input\" min=\"1\" max=\"13\" placeholder=\"1-13\">\n                <button id=\"goto-btn\">Go<\u002Fbutton>\n            <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Part Header -->\n    <div class=\"main-container\" id=\"main-container\">\n        <div id=\"passage-header-container\">\n            <div id=\"part-header-1\" class=\"part-header\">\n                <p><strong>Part 1<\u002Fstrong><\u002Fp>\n                <p>You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below. You have 25 minutes total to complete this passage.<\u002Fp>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"panels-container\">\n            <!-- PASSAGE PANEL -->\n            <div class=\"passage-panel\" id=\"passage-panel\">\n                <div id=\"passage-text-1\" class=\"reading-passage\">\n                    <h4>Do animals dream?<\u002Fh4>\n                    <p>Studies using electrodes attached to the heads of sleepers have shown that when we sleep, we do so in two ways that alternate throughout the night. The first is rapid eye movement (REM) or active sleep. During this stage our eyes move, even though our eyelids are closed. Our muscles also twitch slightly, though they are largely paralysed so we don't hurt ourselves. In contrast, we also engage in non-REM sleep, during which we barely move at all. Most dream states, and certainly those with the most vivid dreams, happen during REM sleep.<\u002Fp>\n                    <p>There's some evidence that other mammals may also dream. For example, researchers compared the brain patterns of rats running through a maze when awake with their brain patterns during REM sleep. They found the patterns were very similar and concluded that the sleeping rats were dreaming about going through the maze.<\u002Fp>\n                    <p>But finding evidence of dreaming in non-mammals has proved more difficult. Their brains are very different from those of humans, and it can often be difficult to record their activity while they are sleeping. Recently, however, researchers succeeded in recording brain activity in sleeping pigeons. As in mammals, the recordings revealed both REM and non-REM sleep. Intriguingly, REM sleep activity was high in brain regions involved in processing visual information, especially images related to physical activities such as flying, which suggests that this may possibly be what the pigeons were dreaming about.<\u002Fp>\n                    <p>That said, dreaming and REM sleep are unlikely to be universal in the animal kingdom. For example, sponges don't have brains, so they lack the machinery for dreaming. There are also some animals with unusual sleep patterns. These include whales and dolphins, which do not shut down their entire brain when they sleep, but only half of it, keeping the rest awake. They also show no sign of REM sleep, suggesting that they may only experience non-REM dreams, which are less vivid. This is surprising because we tend to think of whales and dolphins as having complex inner lives. It's thought that they don't experience REM sleep because during REM sleep animals are more vulnerable to extremes of temperature.<\u002Fp>\n                    <p>Nevertheless, in many cases REM sleep does seem to have benefits. Growing evidence from birds and mammals suggests that REM sleep and dreaming are important for forming memories and learning. It is believed that when events are replayed in dreams, this helps to integrate memories into longer-term storage. As soon as animals evolved moderately complex lifestyles, they would have needed to dream in order to manage these lifestyles.<\u002Fp>\n                    <p>However, we still don't understand how this outward behaviour relates to internal experience. It seems impossible to know what it is like to be a rat or a pigeon, let alone imagine their dreamscapes. We are quick to interpret the twitching limbs and quiet barks of sleeping dogs, but the truth is that we don't know if there is an internal experience of chasing rabbits that comes along with that.<\u002Fp>\n                    <p>Another non-human dreamer offers insight here. In 2019, while making a documentary, David Scheel of Alaska Pacific University in the USA housed an octopus named Heidi in a tank in his living room. At one point, in the middle of the night, Heidi seemed to dream: her limbs and head moved, and her skin rapidly changed colour, as though she was pursuing a crab.<\u002Fp>\n                    <p>Similarly, a report recently emerged of a sleeping octopus apparently having a nightmare. Costello, as the octopus was called, thrashed around, extended his mantle as if trying to make himself look bigger, and squirted ink as though he were being attacked by a predator. The nightmare study is intriguing, says Scheel, but is only based on one animal. He argues that as well as outward behaviour, brain imaging is needed to show that the octopuses are replaying sequences of activities from their waking lives in dreams.<\u002Fp>\n                    <p>The trouble is that we will never be able to experience any animal's dreams. That goes for other humans' dreams too. But we can try to imagine what these dreamscapes are like by meeting animals on their own terms. For example, vision is the dominant sense for many humans, and so our dreams are heavily visual too. Dogs primarily navigate the world using smell while spiders rely much more on vibrations.<\u002Fp>\n                    <p>It is likely that dreaming has served multiple purposes since the first complex animals evolved. And if this is the case, it is possible that better understanding of these purposes might shed light on the true purpose of our own dreams.<\u002Fp>\n                <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"resizer\" id=\"resizer\"><\u002Fdiv>\n\n            <!-- QUESTIONS PANEL -->\n            <div class=\"questions-panel\" id=\"questions-panel\">\n                <div id=\"questions-1\" class=\"question-set\">\n                    <div class=\"questions-container\">\n\n                        <!-- Q1-5: Table Completion -->\n                        <div class=\"question\" data-q-start=\"1\" data-q-end=\"5\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 1–5<\u002Fstrong><\u002Fp>\n                                <p>Complete the table below.<\u002Fp>\n                                <p>Choose <strong>ONE WORD ONLY<\u002Fstrong> from the passage for each answer.<\u002Fp>\n                            <\u002Fdiv>\n                            <table class=\"table-completion\">\n                                <thead>\n                                    <tr><th><\u002Fth><th>Research findings<\u002Fth><th>Comment<\u002Fth><\u002Ftr>\n                                <\u002Fthead>\n                                <tbody>\n                                    <tr>\n                                        <td>Humans<\u002Ftd>\n                                        <td>humans experience REM sleep and non-REM sleep; in REM sleep, the eyes and muscles move<\u002Ftd>\n                                        <td><\u002Ftd>\n                                    <\u002Ftr>\n                                    <tr>\n                                        <td><strong>1<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q1\" placeholder=\"1\"><\u002Ftd>\n                                        <td>similar brain patterns were observed when active and sleeping<\u002Ftd>\n                                        <td>indicative of dreaming<\u002Ftd>\n                                    <\u002Ftr>\n                                    <tr>\n                                        <td>Pigeons<\u002Ftd>\n                                        <td>when sleeping, pigeons displayed activity in parts of the brain that deal with <strong>2<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q2\" placeholder=\"2\"> input<\u002Ftd>\n                                        <td>may have been dreaming of flying<\u002Ftd>\n                                    <\u002Ftr>\n                                    <tr>\n                                        <td>Whales and dolphins<\u002Ftd>\n                                        <td>still have <strong>3<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q3\" placeholder=\"3\"> their brain awake when they sleep; don't experience REM sleep, as this could affect their sensitivity to <strong>4<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q4\" placeholder=\"4\"><\u002Ftd>\n                                        <td>their dreams are probably not very <strong>5<\u002Fstrong> <input type=\"text\" class=\"answer-input\" id=\"q5\" placeholder=\"5\"><\u002Ftd>\n                                    <\u002Ftr>\n                                <\u002Ftbody>\n                            <\u002Ftable>\n                        <\u002Fdiv>\n\n                        <!-- Q6-13: TRUE/FALSE/NOT GIVEN -->\n                        <div class=\"question\" data-q-start=\"6\" data-q-end=\"13\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 6–13<\u002Fstrong><\u002Fp>\n                                <p>Do the following statements agree with the information given in Reading Passage 1?<\u002Fp>\n                                <p>In boxes 6–13 on your answer sheet, write:<\u002Fp>\n                                <ul style=\"list-style:none;padding-left:0;\">\n                                    <li><strong>TRUE<\u002Fstrong> if the statement agrees with the information<\u002Fli>\n                                    <li><strong>FALSE<\u002Fstrong> if the statement contradicts the information<\u002Fli>\n                                    <li><strong>NOT GIVEN<\u002Fstrong> if there is no information on this<\u002Fli>\n                                <\u002Ful>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"6\" data-q-end=\"6\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">6<\u002Fspan><span class=\"tf-question-text\">Dreaming about past experiences helps us to create lasting memories of them.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q6\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q6\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q6\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"7\" data-q-end=\"7\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">7<\u002Fspan><span class=\"tf-question-text\">It is now possible to tell what type of dream a dog is having.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q7\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q7\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q7\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"8\" data-q-end=\"8\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">8<\u002Fspan><span class=\"tf-question-text\">David Scheel's documentary was influential on other research into the sleeping patterns of octopuses.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q8\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q8\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q8\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"9\" data-q-end=\"9\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">9<\u002Fspan><span class=\"tf-question-text\">While it was asleep, the octopus called Costello reacted as if it was hunting.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q9\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q9\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q9\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"10\" data-q-end=\"10\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">10<\u002Fspan><span class=\"tf-question-text\">Scheel believes more research into octopuses' dreams should be carried out.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q10\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q10\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q10\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"11\" data-q-end=\"11\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">11<\u002Fspan><span class=\"tf-question-text\">We may soon be able to share the dreams of other human beings.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q11\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q11\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q11\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"12\" data-q-end=\"12\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">12<\u002Fspan><span class=\"tf-question-text\">Hearing may be an important part of the dreams of some animals.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q12\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q12\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q12\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"tf-question\" data-q-start=\"13\" data-q-end=\"13\">\n                                <div class=\"tf-question-line\"><span class=\"tf-question-number\">13<\u002Fspan><span class=\"tf-question-text\">Interest in the reasons why humans dream has increased greatly in recent times.<\u002Fspan><\u002Fdiv>\n                                <div class=\"tf-options\"><label class=\"tf-option\"><input type=\"radio\" name=\"q13\" value=\"TRUE\"> TRUE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q13\" value=\"FALSE\"> FALSE<\u002Flabel><label class=\"tf-option\"><input type=\"radio\" name=\"q13\" value=\"NOT GIVEN\"> NOT GIVEN<\u002Flabel><\u002Fdiv>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Navigation Arrows -->\n    <div class=\"nav-arrows\">\n        <button class=\"nav-arrow\" id=\"prev-btn\" onclick=\"previousQuestion()\">←<\u002Fbutton>\n        <button class=\"nav-arrow\" id=\"next-btn\" onclick=\"nextQuestion()\">→<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Bottom Nav -->\n    <nav class=\"nav-row\" id=\"nav-row\">\n        <div class=\"footer__questionWrapper___1tZ46 selected\" id=\"part-btn-1\">\n            <button class=\"footer__questionNo___3WNct\">\n                <span class=\"section-prefix\">Part <\u002Fspan><span class=\"sectionNr\">1<\u002Fspan>\n                <span class=\"attemptedCount\">0 of 13<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"footer__subquestionWrapper___9GgoP\" id=\"sq-part-1\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"deliver-btn-wrapper\">\n            <button id=\"deliver-button\">\n                <span>Check Answers<\u002Fspan>\n            <\u002Fbutton>\n        <\u002Fdiv>\n    <\u002Fnav>\n\n    <!-- Context Menu -->\n    <div id=\"contextMenu\" class=\"context-menu\">\n        <div id=\"menu-highlight\" class=\"context-menu-item\" onclick=\"highlightText()\">Highlight<\u002Fdiv>\n        <div id=\"menu-note\" class=\"context-menu-item\" onclick=\"addNote()\">Note<\u002Fdiv>\n        <div id=\"menu-clear\" class=\"context-menu-item\" onclick=\"clearHighlight()\">Clear<\u002Fdiv>\n        <div id=\"menu-clear-all\" class=\"context-menu-item\" onclick=\"clearAllHighlights()\">Clear All<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Results Modal -->\n    <div id=\"results-modal\" class=\"modal-overlay hidden\">\n        <div class=\"modal-content\">\n            <button class=\"modal-close-btn\" onclick=\"closeResultsModal()\">×<\u002Fbutton>\n            <h2>Results — Passage 1<\u002Fh2>\n            <div class=\"results-summary\">\n                <p>Score: <span id=\"results-score\"><\u002Fspan> / 13<\u002Fp>\n                <p>Percentage: <span id=\"results-percent\"><\u002Fspan>%<\u002Fp>\n            <\u002Fdiv>\n            <div id=\"results-details\" class=\"results-details-container\"><\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <script>\n    document.addEventListener('DOMContentLoaded', () => {\n        // STATE\n        let currentQuestion = 1;\n        let selectedRange = null;\n        let timeInSeconds = 1500; // 25 minutes\n        let timerInterval;\n\n        const Q_START = 1;\n        const Q_END = 13;\n\n        const timerDisplay = document.querySelector('.timer-display');\n        const timerToggleButton = document.getElementById('timer-toggle-btn');\n        const timerResetButton = document.getElementById('timer-reset-btn');\n        const deliverButton = document.getElementById('deliver-button');\n        const resizer = document.getElementById('resizer');\n        const passagePanel = document.getElementById('passage-panel');\n        const questionsPanel = document.getElementById('questions-panel');\n        const contextMenu = document.getElementById('contextMenu');\n\n        const playIcon = '<svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"/><path d=\"M8 5v14l11-7L8 5z\"/><\u002Fsvg>';\n        const pauseIcon = '<svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"/><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/><\u002Fsvg>';\n\n        // ANSWERS — only show correct/incorrect, never reveal the answer\n        const correctAnswers = {\n            '1':['rats'],'2':['visual'],'3':['half'],'4':['temperature'],'5':['vivid'],\n            '6':['TRUE'],'7':['FALSE'],'8':['NOT GIVEN'],'9':['FALSE'],'10':['TRUE'],'11':['FALSE'],'12':['NOT GIVEN'],'13':['NOT GIVEN']\n        };\n\n        function buildSubQuestions() {\n            const container = document.getElementById('sq-part-1');\n            container.innerHTML = '';\n            for (let i = Q_START; i <= Q_END; i++) {\n                const btn = document.createElement('button');\n                btn.className = 'subQuestion';\n                btn.textContent = i;\n                btn.onclick = (ev) => { ev.stopPropagation(); goToQuestion(i); };\n                btn.id = `sq-btn-${i}`;\n                container.appendChild(btn);\n            }\n        }\n\n        function isQuestionAnswered(i) {\n            const textInput = document.querySelector(`input[type=\"text\"]#q${i}`);\n            if (textInput) return textInput.value.trim() !== '';\n            const radio = document.querySelector(`input[name=\"q${i}\"]:checked`);\n            if (radio) return true;\n            return false;\n        }\n\n        function updateAllIndicators() {\n            let count = 0;\n            for (let i = Q_START; i <= Q_END; i++) {\n                if (isQuestionAnswered(i)) count++;\n                const btn = document.getElementById(`sq-btn-${i}`);\n                if (btn) {\n                    btn.classList.toggle('answered', isQuestionAnswered(i));\n                    btn.classList.toggle('active', i === currentQuestion);\n                }\n            }\n            const wrapper = document.getElementById('part-btn-1');\n            if (wrapper) {\n                const span = wrapper.querySelector('.attemptedCount');\n                if (span) span.textContent = `${count} of ${Q_END - Q_START + 1}`;\n            }\n        }\n\n        function goToQuestion(qNum) {\n            currentQuestion = qNum;\n            const targetTF = document.querySelector(`.tf-question[data-q-start=\"${qNum}\"]`);\n            const targetInput = document.getElementById(`q${qNum}`);\n            const target = targetTF || targetInput;\n            if (target) {\n                const row = target.closest('tr') || target;\n                const containerRect = questionsPanel.getBoundingClientRect();\n                const rowRect = row.getBoundingClientRect();\n                questionsPanel.scrollTop += rowRect.top - containerRect.top - 90;\n            }\n\n            document.querySelectorAll('.answer-input.active-input').forEach(el => el.classList.remove('active-input'));\n            const activeInput = document.getElementById(`q${qNum}`);\n            if (activeInput) activeInput.classList.add('active-input');\n\n            updateAllIndicators();\n            updateNavArrows();\n        }\n\n        function nextQuestion() { if (currentQuestion < Q_END) goToQuestion(currentQuestion + 1); }\n        function previousQuestion() { if (currentQuestion > Q_START) goToQuestion(currentQuestion - 1); }\n\n        function updateNavArrows() {\n            document.getElementById('prev-btn').disabled = currentQuestion <= Q_START;\n            document.getElementById('next-btn').disabled = currentQuestion >= Q_END;\n        }\n\n        // Timer\n        function updateTimerDisplay() {\n            const m = Math.floor(timeInSeconds / 60);\n            const s = timeInSeconds % 60;\n            timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;\n        }\n\n        function startTimer() {\n            if (timerInterval) clearInterval(timerInterval);\n            timerInterval = setInterval(() => {\n                timeInSeconds--;\n                updateTimerDisplay();\n                if (timeInSeconds <= 0) {\n                    clearInterval(timerInterval);\n                    timerDisplay.textContent = \"Time's up!\";\n                }\n            }, 1000);\n            timerToggleButton.innerHTML = pauseIcon;\n        }\n\n        function pauseTimer() {\n            clearInterval(timerInterval);\n            timerToggleButton.innerHTML = playIcon;\n        }\n\n        function toggleTimer() {\n            if (timerToggleButton.innerHTML.includes('M6 19h4V5H6v14z')) pauseTimer();\n            else startTimer();\n        }\n\n        function resetTimer() {\n            timeInSeconds = 1500;\n            updateTimerDisplay();\n            startTimer();\n        }\n\n        // CHECK ANSWERS — only show correct/incorrect, never reveal the answer\n        function checkAnswers() {\n            const allInputs = document.querySelectorAll('input, select, textarea');\n            allInputs.forEach(inp => inp.disabled = true);\n            deliverButton.disabled = true;\n            deliverButton.style.cursor = 'not-allowed';\n            clearInterval(timerInterval);\n\n            let score = 0;\n            const resultsDetails = document.getElementById('results-details');\n            resultsDetails.innerHTML = '';\n\n            document.querySelectorAll('.correct, .incorrect').forEach(el => {\n                el.classList.remove('correct', 'incorrect');\n            });\n\n            for (let i = Q_START; i <= Q_END; i++) {\n                const accepted = correctAnswers[String(i)] || [];\n                let userAnswer = '';\n                let isCorrect = false;\n\n                const textEl = document.querySelector(`input[type=\"text\"]#q${i}`);\n                const radioEl = document.querySelector(`input[name=\"q${i}\"]:checked`);\n\n                if (textEl) {\n                    userAnswer = textEl.value.trim();\n                    isCorrect = accepted.some(a => userAnswer.toLowerCase() === a.toLowerCase());\n                } else if (radioEl) {\n                    userAnswer = radioEl.value;\n                    isCorrect = accepted.includes(userAnswer);\n                    const tfQ = radioEl.closest('.tf-question');\n                    if (tfQ) tfQ.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n\n                if (isCorrect) score++;\n\n                const btn = document.getElementById(`sq-btn-${i}`);\n                if (btn) {\n                    btn.classList.remove('answered');\n                    btn.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n\n                const item = document.createElement('div');\n                item.className = `result-item ${isCorrect ? 'correct' : 'incorrect'}`;\n                item.innerHTML = `<span>Q${i}: ${userAnswer || 'Not Answered'}<\u002Fspan><span>${isCorrect ? '✔ Correct' : '✖ Incorrect'}<\u002Fspan>`;\n                resultsDetails.appendChild(item);\n            }\n\n            const total = Q_END - Q_START + 1;\n            document.getElementById('results-score').textContent = score;\n            document.getElementById('results-percent').textContent = Math.round((score / total) * 100);\n            document.getElementById('results-modal').classList.remove('hidden');\n        }\n\n        function closeResultsModal() {\n            document.getElementById('results-modal').classList.add('hidden');\n        }\n\n        // HIGHLIGHT & NOTE\n        function initializeContextMenu() {\n            const panels = [passagePanel, questionsPanel];\n\n            document.addEventListener('selectionchange', () => {\n                const sel = window.getSelection();\n                if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {\n                    const range = sel.getRangeAt(0);\n                    if (panels.some(p => p.contains(range.commonAncestorContainer))) {\n                        selectedRange = range;\n                    }\n                }\n            });\n\n            const showMenu = (e) => {\n                const target = e.target;\n                const onHL = target.closest('.highlight, .comment-highlight');\n                const hasSelection = selectedRange && selectedRange.toString().trim().length > 0;\n                let show = false;\n                if (onHL) {\n                    document.getElementById('menu-highlight').style.display = 'none';\n                    document.getElementById('menu-note').style.display = 'none';\n                    document.getElementById('menu-clear').style.display = 'block';\n                    document.getElementById('menu-clear-all').style.display = 'block';\n                    contextMenu.targetElementForClear = onHL;\n                    show = true;\n                } else if (hasSelection && panels.some(p => p.contains(selectedRange.commonAncestorContainer))) {\n                    document.getElementById('menu-highlight').style.display = 'flex';\n                    document.getElementById('menu-note').style.display = 'flex';\n                    document.getElementById('menu-clear').style.display = 'none';\n                    document.getElementById('menu-clear-all').style.display = 'block';\n                    show = true;\n                }\n                if (show) {\n                    e.preventDefault();\n                    contextMenu.style.display = 'block';\n                    const mh = contextMenu.offsetHeight, mw = contextMenu.offsetWidth;\n                    let left = e.pageX, top = e.pageY - mh - 5;\n                    if (left + mw > window.innerWidth) left = window.innerWidth - mw - 5;\n                    if (top < 0) top = e.pageY + 5;\n                    contextMenu.style.left = `${left}px`;\n                    contextMenu.style.top = `${top}px`;\n                }\n            };\n\n            panels.forEach(p => p.addEventListener('contextmenu', showMenu));\n            document.addEventListener('click', (e) => {\n                if (contextMenu.style.display === 'block' && !contextMenu.contains(e.target)) closeContextMenu();\n            });\n        }\n\n        function closeContextMenu() {\n            contextMenu.style.display = 'none';\n            selectedRange = null;\n        }\n\n        function unwrapElement(el) {\n            const parent = el.parentNode;\n            if (!parent) return;\n            while (el.firstChild) parent.insertBefore(el.firstChild, el);\n            parent.removeChild(el);\n            parent.normalize();\n        }\n\n        window.highlightText = () => {\n            if (selectedRange && !selectedRange.collapsed) {\n                const selectedContent = selectedRange.extractContents();\n                const span = document.createElement('span');\n                span.className = 'highlight';\n                span.appendChild(selectedContent);\n                selectedRange.insertNode(span);\n            }\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.addNote = () => {\n            const note = prompt('Enter your note:');\n            if (!note || !selectedRange || selectedRange.collapsed) {\n                closeContextMenu();\n                window.getSelection().removeAllRanges();\n                return;\n            }\n            const span = document.createElement('span');\n            span.className = 'comment-highlight';\n            const tooltip = document.createElement('span');\n            tooltip.className = 'comment-tooltip';\n            tooltip.textContent = note;\n            span.appendChild(selectedRange.extractContents());\n            span.appendChild(tooltip);\n            selectedRange.insertNode(span);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.clearHighlight = () => {\n            const el = contextMenu.targetElementForClear;\n            if (el) unwrapElement(el);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.clearAllHighlights = () => {\n            document.querySelectorAll('.highlight, .comment-highlight').forEach(unwrapElement);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        // RESIZER\n        function initResize(e) {\n            e.preventDefault();\n            const startX = e.clientX;\n            const startWidth = passagePanel.offsetWidth;\n            const doDrag = (e) => {\n                const nw = startWidth + e.clientX - startX;\n                if (nw > 200 && (document.body.clientWidth - nw - resizer.offsetWidth) > 200) {\n                    passagePanel.style.flex = `0 0 ${nw}px`;\n                }\n            };\n            const stopDrag = () => {\n                window.removeEventListener('mousemove', doDrag);\n                window.removeEventListener('mouseup', stopDrag);\n            };\n            window.addEventListener('mousemove', doDrag);\n            window.addEventListener('mouseup', stopDrag);\n        }\n\n        // GOTO WIDGET\n        document.getElementById('goto-btn').addEventListener('click', () => {\n            const val = parseInt(document.getElementById('goto-input').value);\n            if (val >= Q_START && val <= Q_END) goToQuestion(val);\n        });\n        document.getElementById('goto-input').addEventListener('keydown', (e) => {\n            if (e.key === 'Enter') document.getElementById('goto-btn').click();\n        });\n\n        window.nextQuestion = nextQuestion;\n        window.previousQuestion = previousQuestion;\n        window.goToQuestion = goToQuestion;\n        window.closeResultsModal = closeResultsModal;\n\n        function initialize() {\n            buildSubQuestions();\n            startTimer();\n            updateAllIndicators();\n            updateNavArrows();\n            resizer.addEventListener('mousedown', initResize);\n            initializeContextMenu();\n            document.body.addEventListener('input', updateAllIndicators);\n            document.body.addEventListener('change', updateAllIndicators);\n            deliverButton.addEventListener('click', checkAnswers);\n            timerToggleButton.addEventListener('click', toggleTimer);\n            timerResetButton.addEventListener('click', resetTimer);\n        }\n\n        initialize();\n    });\n    <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
