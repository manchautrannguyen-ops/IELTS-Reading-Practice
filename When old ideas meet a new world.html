  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

bottom: 8px; }\n        .endings-box p { margin: 5px 0; font-size: 15px; display: flex; gap: 10px; }\n        .endings-box .rn { font-weight: bold; min-width: 22px; color: #4a90e2; }\n        .notes-box { background-color: #f9f9f9; border: 1px solid #ddd; padding: 14px 18px; border-radius: 5px; margin: 12px 0 20px; font-size: 15px; }\n        .notes-box .nb-title { text-align: center; font-weight: bold; margin-bottom: 12px; }\n        .notes-box h5 { font-size: 15px; font-weight: bold; margin: 14px 0 6px; }\n        .notes-box ul { list-style: none; padding-left: 0; }\n        .notes-box li { margin-bottom: 8px; padding-left: 16px; position: relative; }\n        .notes-box li::before { content: '\u2022'; position: absolute; left: 0; color: #4a90e2; }\n        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; justify-content: center; align-items: center; }\n        .modal-content { background: white; border-radius: 8px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }\n        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #333; }\n        .results-summary { font-size: 18px; margin-bottom: 20px; }\n        .results-summary p { margin-bottom: 8px; }\n        .results-details-container { display: flex; flex-direction: column; gap: 8px; }\n        .result-item { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 4px; font-size: 15px; }\n        .result-item.correct { background: #e9f7ef; }\n        .result-item.incorrect { background: #f8d7da; }\n        #goto-widget { display: flex; align-items: center; gap: 5px; }\n        #goto-input { width: 80px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }\n        #goto-btn { padding: 4px 10px; border: 1px solid #ccc; background-color: #f0f0f0; border-radius: 4px; cursor: pointer; }\n        a { color: #4a90e2; }\n        a:hover { color: #357abd; }\n    <\/style>\n<\/head>\n<body class=\"gated\">\n\n    <div class=\"gate-overlay\" id=\"gateOverlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"gateTitle\">\n      <div class=\"gate-box\">\n        <span class=\"gate-eyebrow\">Before you start<\/span>\n        <h2 id=\"gateTitle\">Enter your details<\/h2>\n        <p class=\"gate-sub\">Your name and class are required. The timer starts once you begin.<\/p>\n        <div class=\"gate-field\">\n          <label for=\"gateName\">Full name <span class=\"req\">*<\/span><\/label>\n          <input type=\"text\" id=\"gateName\" autocomplete=\"name\" placeholder=\"e.g. Nguyen Van A\" required>\n          <div class=\"gate-err\" id=\"nameErr\">Please enter your name.<\/div>\n        <\/div>\n        <div class=\"gate-field\">\n          <label for=\"gateClass\">Class <span class=\"req\">*<\/span><\/label>\n          <input type=\"text\" id=\"gateClass\" autocomplete=\"off\" placeholder=\"e.g. 10A1\" required>\n          <div class=\"gate-err\" id=\"classErr\">Please enter your class.<\/div>\n        <\/div>\n        <button type=\"button\" class=\"gate-start-btn\" id=\"gateStart\">Start test<\/button>\n        <div class=\"gate-note\">Reading \u00b7 Questions 1\u201313 \u00b7 25 minutes<\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Header -->\n    <div class=\"header\">\n        <div class=\"test-info\">\n            <span><strong>IELTS Academic Reading \u2014 Passage 1<\/strong><\/span>\n            <div class=\"timer-container\">\n                <span>\u23f1<\/span>&nbsp;<span class=\"timer-display\">25:00<\/span>\n                <div class=\"timer-controls\">\n                    <button id=\"timer-toggle-btn\" title=\"Pause/Resume\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"><\/path><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"><\/path><\/svg>\n                    <\/button>\n                    <button id=\"timer-reset-btn\" title=\"Reset Timer\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"><\/path><path d=\"M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z\"><\/path><\/svg>\n                    <\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n        <div class=\"header-icons\">\n            <div id=\"goto-widget\">\n                <label for=\"goto-input\" style=\"font-size:14px;\">Go to Q:<\/label>\n                <input type=\"number\" id=\"goto-input\" min=\"1\" max=\"13\" placeholder=\"1-13\">\n                <button id=\"goto-btn\">Go<\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Part Header -->\n    <div class=\"main-container\" id=\"main-container\">\n        <div id=\"passage-header-container\">\n            <div id=\"part-header-1\" class=\"part-header\">\n                <p><strong>Reading Passage 1<\/strong><\/p>\n                <p>You should spend about 20 minutes on Questions 1\u201313, which are based on Reading Passage 1 below. You have 25 minutes to complete this passage.<\/p>\n            <\/div>\n        <\/div>\n\n        <div class=\"panels-container\">\n            <!-- PASSAGE PANEL -->\n            <div class=\"passage-panel\" id=\"passage-panel\">\n                <div id=\"passage-text-1\" class=\"reading-passage\">\n                    <h4>When Old Ideas Meet a New World<\/h4>\n                    <p>Every society passes its ideas from one generation to the next. Parents teach children how to behave, what to value, and what counts as right or wrong. Sociologists call this process socialisation, and for most of human history it worked smoothly: the world a child grew up in looked very much like the world their parents and grandparents had known, so the older generation's advice stayed useful for a lifetime.<\/p>\n                    <p>Things change when the world itself changes quickly. Researchers have long noticed that ideas and customs tend to lag behind new conditions. A rule that made perfect sense in one era can survive long after the situation that created it has disappeared. For example, older generations often urge young people to stay in a single job for life, because in their time loyalty to one company brought security and a pension. Today's economy rewards flexibility and frequent job changes, so the same advice can hold young people back rather than protect them. The idea is not foolish; it is simply out of date.<\/p>\n                    <p>This helps explain why tension between generations appears again and again across different countries and time periods. Sociologists who study this pattern argue that people are shaped most strongly by the events of their youth. Someone who grew up during a war or an economic crisis learns to save carefully and avoid risk. Someone who grew up in a stable, connected, digital world learns to adapt, share information, and take chances. When these two groups meet, they are not simply disagreeing about one issue \u2014 they are seeing the world through the eyes of the different times that formed them.<\/p>\n                    <p>Yet studies also warn against dismissing older ideas too quickly. Many traditions survive precisely because they solve real human problems. Customs around family support, community cooperation, and caring for the elderly have lasted for generations because they help societies stay stable and connected. When young people abandon these ideas entirely, communities can become more isolated, even as they become more modern. In this sense, \"old\" and \"useless\" are not the same thing.<\/p>\n                    <p>One of the most important jobs these shared ideas do is hold people together. Sociologists have long argued that a society is not just a crowd of separate individuals; it stays united because its members share the same basic values, customs, and sense of right and wrong. When people celebrate the same festivals, follow the same manners, and respect the same traditions, they feel that they belong to one group rather than standing alone. These shared habits act like an invisible thread connecting strangers, so that a person can walk into a room full of people they have never met and still feel a sense of common ground. Many of these values are handed down by older generations, which means that \"traditional\" ideas are often the very things that keep a community feeling like a community.<\/p>\n                    <p>Sociologists therefore tend to reject the simple view that the young are always right and the old are always behind the times. Instead, they describe a constant negotiation between generations. The older group passes on knowledge that has been tested by experience, while the younger group updates that knowledge to fit new tools and new conditions. Healthy societies, the research suggests, are not the ones where either side wins, but the ones where both kinds of thinking are allowed to shape the future together.<\/p>\n                <\/div>\n            <\/div>\n\n            <div class=\"resizer\" id=\"resizer\"><\/div>\n\n            <!-- QUESTIONS PANEL -->\n            <div class=\"questions-panel\" id=\"questions-panel\">\n                <div id=\"questions-1\" class=\"question-set\">\n                    <div class=\"questions-container\">\n\n                        <!-- Q1-6: Sentence Endings -->\n                        <div class=\"question\" data-q-start=\"1\" data-q-end=\"6\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 1\u20136<\/strong><\/p>\n                                <p>Complete each sentence with the correct ending, <strong>A\u2013I<\/strong>, below.<\/p>\n                                <p>Write the correct letter, A\u2013I, in boxes 1\u20136 on your answer sheet.<\/p>\n                            <\/div>\n                            <div class=\"matching-form-container\">\n                                <div class=\"matching-form-row\"><label for=\"q1\" class=\"matching-form-label\"><strong>1<\/strong>&nbsp;&nbsp;For most of human history, the advice of older generations stayed useful because .............<\/label><select class=\"answer-input\" id=\"q1\"><option value=\"\"><\/option><option>A<\/option><option>B<\/option><option>C<\/option><option>D<\/option><option>E<\/option><option>F<\/option><option>G<\/option><option>H<\/option><option>I<\/option><\/select><\/div>\n                                <div class=\"matching-form-row\"><label for=\"q2\" class=\"matching-form-label\"><strong>2<\/strong>&nbsp;&nbsp;The old recommendation to stay in one job for life originally made sense because .............<\/label><select class=\"answer-input\" id=\"q2\"><option value=\"\"><\/option><option>A<\/option><option>B<\/option><option>C<\/option><option>D<\/option><option>E<\/option><option>F<\/option><option>G<\/option><option>H<\/option><option>I<\/option><\/select><\/div>\n                                <div class=\"matching-form-row\"><label for=\"q3\" class=\"matching-form-label\"><strong>3<\/strong>&nbsp;&nbsp;Sociologists argue that a person's outlook is shaped most powerfully by .............<\/label><select class=\"answer-input\" id=\"q3\"><option value=\"\"><\/option><option>A<\/option><option>B<\/option><option>C<\/option><option>D<\/option><option>E<\/option><option>F<\/option><option>G<\/option><option>H<\/option><option>I<\/option><\/select><\/div>\n                                <div class=\"matching-form-row\"><label for=\"q4\" class=\"matching-form-label\"><strong>4<\/strong>&nbsp;&nbsp;Some traditional customs have lasted for generations because .............<\/label><select class=\"answer-input\" id=\"q4\"><option value=\"\"><\/option><option>A<\/option><option>B<\/option><option>C<\/option><option>D<\/option><option>E<\/option><option>F<\/option><option>G<\/option><option>H<\/option><option>I<\/option><\/select><\/div>\n                                <div class=\"matching-form-row\"><label for=\"q5\" class=\"matching-form-label\"><strong>5<\/strong>&nbsp;&nbsp;Shared values and customs matter because .............<\/label><select class=\"answer-input\" id=\"q5\"><option value=\"\"><\/option><option>A<\/option><option>B<\/option><option>C<\/option><option>D<\/option><option>E<\/option><option>F<\/option><option>G<\/option><option>H<\/option><option>I<\/option><\/select><\/div>\n                                <div class=\"matching-form-row\"><label for=\"q6\" class=\"matching-form-label\"><strong>6<\/strong>&nbsp;&nbsp;Sociologists believe that the healthiest societies are those in which .............<\/label><select class=\"answer-input\" id=\"q6\"><option value=\"\"><\/option><option>A<\/option><option>B<\/option><option>C<\/option><option>D<\/option><option>E<\/option><option>F<\/option><option>G<\/option><option>H<\/option><option>I<\/option><\/select><\/div>\n                            <\/div>\n                            <div class=\"endings-box\">\n                                <div class=\"eb-title\">List of Endings<\/div>\n                                <p><span class=\"rn\">A<\/span><span>they continue to solve real human problems.<\/span><\/p>\n                                <p><span class=\"rn\">B<\/span><span>young people are usually right and their elders are out of date.<\/span><\/p>\n                                <p><span class=\"rn\">C<\/span><span>the world changed very little from one generation to the next.<\/span><\/p>\n                                <p><span class=\"rn\">D<\/span><span>people naturally resist any kind of social change.<\/span><\/p>\n                                <p><span class=\"rn\">E<\/span><span>the thinking of both generations helps shape the future.<\/span><\/p>\n                                <p><span class=\"rn\">F<\/span><span>loyalty to one company once provided security and a pension.<\/span><\/p>\n                                <p><span class=\"rn\">G<\/span><span>they make people feel they belong to a single group.<\/span><\/p>\n                                <p><span class=\"rn\">H<\/span><span>modern life has made most old customs unnecessary.<\/span><\/p>\n                                <p><span class=\"rn\">I<\/span><span>the events they experienced when they were young.<\/span><\/p>\n                            <\/div>\n                        <\/div>\n\n                        <!-- Q7-13: Note Completion -->\n                        <div class=\"question\" data-q-start=\"7\" data-q-end=\"13\">\n                            <div class=\"question-prompt\">\n                                <p><strong>Questions 7\u201313<\/strong><\/p>\n                                <p>Complete the notes below.<\/p>\n                                <p>Choose <strong>ONE WORD ONLY<\/strong> from the passage for each answer.<\/p>\n                                <p>Write your answers in boxes 7\u201313 on your answer sheet.<\/p>\n                            <\/div>\n                            <div class=\"notes-box\">\n                                <p class=\"nb-title\">Generational values: key ideas<\/p>\n                                <h5>Passing values on<\/h5>\n                                <ul>\n                                    <li>Teaching children how to behave is part of a process called <strong>(7)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q7\" placeholder=\"7\"><\/li>\n                                    <li>While the world stayed the same, this advice lasted a lifetime<\/li>\n                                <\/ul>\n                                <h5>When conditions change quickly<\/h5>\n                                <ul>\n                                    <li>Ideas and customs often <strong>(8)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q8\" placeholder=\"8\"> behind changing conditions<\/li>\n                                    <li>Modern economies now favour <strong>(9)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q9\" placeholder=\"9\"> and frequent job changes, so old job advice no longer fits<\/li>\n                                <\/ul>\n                                <h5>What shapes a generation<\/h5>\n                                <ul>\n                                    <li>People are influenced most by the experiences of their <strong>(10)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q10\" placeholder=\"10\"><\/li>\n                                <\/ul>\n                                <h5>Why old traditions can still matter<\/h5>\n                                <ul>\n                                    <li>Many survive because they still solve genuine human <strong>(11)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q11\" placeholder=\"11\"><\/li>\n                                    <li>Customs such as caring for the elderly help keep societies stable and <strong>(12)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q12\" placeholder=\"12\"><\/li>\n                                <\/ul>\n                                <h5>Shared values and belonging<\/h5>\n                                <ul>\n                                    <li>Common habits work like an invisible <strong>(13)<\/strong> <input type=\"text\" class=\"answer-input\" id=\"q13\" placeholder=\"13\"> linking people who are strangers<\/li>\n                                <\/ul>\n                            <\/div>\n                        <\/div>\n\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Bottom Nav -->\n    <nav class=\"nav-row\" id=\"nav-row\">\n        <div class=\"footer__questionWrapper___1tZ46 selected\" id=\"part-btn-1\">\n            <button class=\"footer__questionNo___3WNct\">\n                <span class=\"section-prefix\">Passage <\/span><span class=\"sectionNr\">1<\/span>\n                <span class=\"attemptedCount\">0 of 13<\/span>\n            <\/button>\n            <div class=\"footer__subquestionWrapper___9GgoP\" id=\"sq-part-1\"><\/div>\n        <\/div>\n        <div class=\"nav-arrows\">\n            <button class=\"nav-arrow\" id=\"prev-btn\" onclick=\"previousQuestion()\">\u2190<\/button>\n            <button class=\"nav-arrow\" id=\"next-btn\" onclick=\"nextQuestion()\">\u2192<\/button>\n        <\/div>\n        <div class=\"deliver-btn-wrapper\">\n            <button id=\"deliver-button\">\n                <span>Check Answers<\/span>\n            <\/button>\n        <\/div>\n    <\/nav>\n\n    <!-- Context Menu -->\n    <div id=\"contextMenu\" class=\"context-menu\">\n        <div id=\"menu-highlight\" class=\"context-menu-item\" onclick=\"highlightText()\">Highlight<\/div>\n        <div id=\"menu-note\" class=\"context-menu-item\" onclick=\"addNote()\">Note<\/div>\n        <div id=\"menu-clear\" class=\"context-menu-item\" onclick=\"clearHighlight()\">Clear<\/div>\n        <div id=\"menu-clear-all\" class=\"context-menu-item\" onclick=\"clearAllHighlights()\">Clear All<\/div>\n    <\/div>\n\n    <!-- Results Modal -->\n    <div id=\"results-modal\" class=\"modal-overlay hidden\">\n        <div class=\"modal-content\">\n            <button class=\"modal-close-btn\" onclick=\"closeResultsModal()\">\u00d7<\/button>\n            <h2>Results \u2014 Passage 1<\/h2>\n            <div class=\"results-summary\">\n                <p>Score: <span id=\"results-score\"><\/span> / 13<\/p>\n                <p>Percentage: <span id=\"results-percent\"><\/span>%<\/p>\n            <\/div>\n            <div id=\"results-details\" class=\"results-details-container\"><\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n    (function(){ const __runTest = () => {\n        let currentQuestion = 1;\n        let selectedRange = null;\n        let timeInSeconds = 1500; // 25 minutes\n        let timerInterval;\n\n        const Q_START = 1;\n        const Q_END = 13;\n\n        const timerDisplay = document.querySelector('.timer-display');\n        const timerToggleButton = document.getElementById('timer-toggle-btn');\n        const timerResetButton = document.getElementById('timer-reset-btn');\n        const deliverButton = document.getElementById('deliver-button');\n        const resizer = document.getElementById('resizer');\n        const passagePanel = document.getElementById('passage-panel');\n        const questionsPanel = document.getElementById('questions-panel');\n        const contextMenu = document.getElementById('contextMenu');\n\n        const playIcon = '<svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"/><path d=\"M8 5v14l11-7L8 5z\"/><\/svg>';\n        const pauseIcon = '<svg xmlns=\"http://www.w3.org/2000/svg\" height=\"24px\" viewBox=\"0 0 24 24\" width=\"24px\"><path d=\"M0 0h24v24H0V0z\" fill=\"none\"/><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/><\/svg>';\n\n        // ANSWERS \u2014 only show correct/incorrect, never reveal the answer\n        const correctAnswers = {\n            '1':['C'],'2':['F'],'3':['I'],'4':['A'],'5':['G'],'6':['E'],\n            '7':['socialisation','socialization'],'8':['lag'],'9':['flexibility'],'10':['youth'],'11':['problems'],'12':['connected'],'13':['thread']\n        };\n\n        function buildSubQuestions() {\n            const container = document.getElementById('sq-part-1');\n            container.innerHTML = '';\n            for (let i = Q_START; i <= Q_END; i++) {\n                const btn = document.createElement('button');\n                btn.className = 'subQuestion';\n                btn.textContent = i;\n                btn.onclick = (ev) => { ev.stopPropagation(); goToQuestion(i); };\n                btn.id = `sq-btn-${i}`;\n                container.appendChild(btn);\n            }\n        }\n\n        function isQuestionAnswered(i) {\n            const textInput = document.querySelector(`input[type=\"text\"]#q${i}`);\n            if (textInput) return textInput.value.trim() !== '';\n            const sel = document.querySelector(`select#q${i}`);\n            if (sel) return sel.value !== '';\n            return false;\n        }\n\n        function updateAllIndicators() {\n            let count = 0;\n            for (let i = Q_START; i <= Q_END; i++) {\n                if (isQuestionAnswered(i)) count++;\n                const btn = document.getElementById(`sq-btn-${i}`);\n                if (btn) {\n                    btn.classList.toggle('answered', isQuestionAnswered(i));\n                    btn.classList.toggle('active', i === currentQuestion);\n                }\n            }\n            const wrapper = document.getElementById('part-btn-1');\n            if (wrapper) {\n                const span = wrapper.querySelector('.attemptedCount');\n                if (span) span.textContent = `${count} of ${Q_END - Q_START + 1}`;\n            }\n        }\n\n        function goToQuestion(qNum) {\n            currentQuestion = qNum;\n            const targetEl = document.getElementById(`q${qNum}`);\n            if (targetEl) {\n                const row = targetEl.closest('.matching-form-row') || targetEl.closest('li') || targetEl;\n                const containerRect = questionsPanel.getBoundingClientRect();\n                const rowRect = row.getBoundingClientRect();\n                questionsPanel.scrollTop += rowRect.top - containerRect.top - 90;\n            }\n\n            document.querySelectorAll('.answer-input.active-input').forEach(el => el.classList.remove('active-input'));\n            const activeInput = document.getElementById(`q${qNum}`);\n            if (activeInput) activeInput.classList.add('active-input');\n\n            updateAllIndicators();\n            updateNavArrows();\n        }\n\n        function nextQuestion() { if (currentQuestion < Q_END) goToQuestion(currentQuestion + 1); }\n        function previousQuestion() { if (currentQuestion > Q_START) goToQuestion(currentQuestion - 1); }\n\n        function updateNavArrows() {\n            document.getElementById('prev-btn').disabled = currentQuestion <= Q_START;\n            document.getElementById('next-btn').disabled = currentQuestion >= Q_END;\n        }\n\n        function updateTimerDisplay() {\n            const m = Math.floor(timeInSeconds / 60);\n            const s = timeInSeconds % 60;\n            timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;\n        }\n\n        function startTimer() {\n            if (timerInterval) clearInterval(timerInterval);\n            timerInterval = setInterval(() => {\n                timeInSeconds--;\n                updateTimerDisplay();\n                if (timeInSeconds <= 0) {\n                    clearInterval(timerInterval);\n                    timerDisplay.textContent = \"Time's up!\";\n                }\n            }, 1000);\n            timerToggleButton.innerHTML = pauseIcon;\n        }\n\n        function pauseTimer() {\n            clearInterval(timerInterval);\n            timerToggleButton.innerHTML = playIcon;\n        }\n\n        function toggleTimer() {\n            if (timerToggleButton.innerHTML.includes('M6 19h4V5H6v14z')) pauseTimer();\n            else startTimer();\n        }\n\n        function resetTimer() {\n            timeInSeconds = 1500;\n            updateTimerDisplay();\n            startTimer();\n        }\n\n        // CHECK ANSWERS \u2014 only show correct/incorrect, never reveal the answer\n        function checkAnswers() {\n            document.querySelectorAll('input, select, textarea').forEach(inp => inp.disabled = true);\n            deliverButton.disabled = true;\n            deliverButton.style.cursor = 'not-allowed';\n            clearInterval(timerInterval);\n\n            let score = 0;\n            const resultsDetails = document.getElementById('results-details');\n            resultsDetails.innerHTML = '';\n\n            document.querySelectorAll('.correct, .incorrect').forEach(el => {\n                el.classList.remove('correct', 'incorrect');\n            });\n\n            for (let i = Q_START; i <= Q_END; i++) {\n                const accepted = correctAnswers[String(i)] || [];\n                let userAnswer = '';\n                let isCorrect = false;\n\n                const textEl = document.querySelector(`input[type=\"text\"]#q${i}`);\n                const selEl = document.querySelector(`select#q${i}`);\n\n                if (textEl) {\n                    userAnswer = textEl.value.trim();\n                    isCorrect = accepted.some(a => userAnswer.toLowerCase() === a.toLowerCase());\n                } else if (selEl) {\n                    userAnswer = selEl.value;\n                    isCorrect = accepted.includes(userAnswer);\n                    const row = selEl.closest('.matching-form-row');\n                    if (row) row.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n\n                if (isCorrect) score++;\n\n                const btn = document.getElementById(`sq-btn-${i}`);\n                if (btn) {\n                    btn.classList.remove('answered');\n                    btn.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n\n                const item = document.createElement('div');\n                item.className = `result-item ${isCorrect ? 'correct' : 'incorrect'}`;\n                item.innerHTML = `<span>Q${i}: ${userAnswer || 'Not Answered'}<\/span><span>${isCorrect ? '\u2714 Correct' : '\u2716 Incorrect'}<\/span>`;\n                resultsDetails.appendChild(item);\n            }\n\n            const total = Q_END - Q_START + 1;\n            document.getElementById('results-score').textContent = score;\n            document.getElementById('results-percent').textContent = Math.round((score / total) * 100);\n            document.getElementById('results-modal').classList.remove('hidden');\n\n            // Send results to the Google Form (name + class captured at the start gate).\n            submitToGoogleForm(studentName, studentClass, collectAnswers(), score);\n        }\n\n        function closeResultsModal() {\n            document.getElementById('results-modal').classList.add('hidden');\n        }\n\n        function initializeContextMenu() {\n            const panels = [passagePanel, questionsPanel];\n\n            document.addEventListener('selectionchange', () => {\n                const sel = window.getSelection();\n                if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {\n                    const range = sel.getRangeAt(0);\n                    if (panels.some(p => p.contains(range.commonAncestorContainer))) {\n                        selectedRange = range;\n                    }\n                }\n            });\n\n            const showMenu = (e) => {\n                const target = e.target;\n                const onHL = target.closest('.highlight, .comment-highlight');\n                const hasSelection = selectedRange && selectedRange.toString().trim().length > 0;\n                let show = false;\n                if (onHL) {\n                    document.getElementById('menu-highlight').style.display = 'none';\n                    document.getElementById('menu-note').style.display = 'none';\n                    document.getElementById('menu-clear').style.display = 'block';\n                    document.getElementById('menu-clear-all').style.display = 'block';\n                    contextMenu.targetElementForClear = onHL;\n                    show = true;\n                } else if (hasSelection && panels.some(p => p.contains(selectedRange.commonAncestorContainer))) {\n                    document.getElementById('menu-highlight').style.display = 'flex';\n                    document.getElementById('menu-note').style.display = 'flex';\n                    document.getElementById('menu-clear').style.display = 'none';\n                    document.getElementById('menu-clear-all').style.display = 'block';\n                    show = true;\n                }\n                if (show) {\n                    e.preventDefault();\n                    contextMenu.style.display = 'block';\n                    const mh = contextMenu.offsetHeight, mw = contextMenu.offsetWidth;\n                    let left = e.pageX, top = e.pageY - mh - 5;\n                    if (left + mw > window.innerWidth) left = window.innerWidth - mw - 5;\n                    if (top < 0) top = e.pageY + 5;\n                    contextMenu.style.left = `${left}px`;\n                    contextMenu.style.top = `${top}px`;\n                }\n            };\n\n            panels.forEach(p => p.addEventListener('contextmenu', showMenu));\n            document.addEventListener('click', (e) => {\n                if (contextMenu.style.display === 'block' && !contextMenu.contains(e.target)) closeContextMenu();\n            });\n        }\n\n        function closeContextMenu() {\n            contextMenu.style.display = 'none';\n            selectedRange = null;\n        }\n\n        function unwrapElement(el) {\n            const parent = el.parentNode;\n            if (!parent) return;\n            while (el.firstChild) parent.insertBefore(el.firstChild, el);\n            parent.removeChild(el);\n            parent.normalize();\n        }\n\n        window.highlightText = () => {\n            if (selectedRange && !selectedRange.collapsed) {\n                const selectedContent = selectedRange.extractContents();\n                const span = document.createElement('span');\n                span.className = 'highlight';\n                span.appendChild(selectedContent);\n                selectedRange.insertNode(span);\n            }\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.addNote = () => {\n            const note = prompt('Enter your note:');\n            if (!note || !selectedRange || selectedRange.collapsed) {\n                closeContextMenu();\n                window.getSelection().removeAllRanges();\n                return;\n            }\n            const span = document.createElement('span');\n            span.className = 'comment-highlight';\n            const tooltip = document.createElement('span');\n            tooltip.className = 'comment-tooltip';\n            tooltip.textContent = note;\n            span.appendChild(selectedRange.extractContents());\n            span.appendChild(tooltip);\n            selectedRange.insertNode(span);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.clearHighlight = () => {\n            const el = contextMenu.targetElementForClear;\n            if (el) unwrapElement(el);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        window.clearAllHighlights = () => {\n            document.querySelectorAll('.highlight, .comment-highlight').forEach(unwrapElement);\n            closeContextMenu();\n            window.getSelection().removeAllRanges();\n        };\n\n        function initResize(e) {\n            e.preventDefault();\n            const startX = e.clientX;\n            const startWidth = passagePanel.offsetWidth;\n            const doDrag = (e) => {\n                const nw = startWidth + e.clientX - startX;\n                if (nw > 200 && (document.body.clientWidth - nw - resizer.offsetWidth) > 200) {\n                    passagePanel.style.flex = `0 0 ${nw}px`;\n                }\n            };\n            const stopDrag = () => {\n                window.removeEventListener('mousemove', doDrag);\n                window.removeEventListener('mouseup', stopDrag);\n            };\n            window.addEventListener('mousemove', doDrag);\n            window.addEventListener('mouseup', stopDrag);\n        }\n\n        document.getElementById('goto-btn').addEventListener('click', () => {\n            const val = parseInt(document.getElementById('goto-input').value);\n            if (val >= Q_START && val <= Q_END) goToQuestion(val);\n        });\n        document.getElementById('goto-input').addEventListener('keydown', (e) => {\n            if (e.key === 'Enter') document.getElementById('goto-btn').click();\n        });\n\n        window.nextQuestion = nextQuestion;\n        window.previousQuestion = previousQuestion;\n        window.goToQuestion = goToQuestion;\n        // \u2500\u2500 Required name + class gate (must be completed before the test) \u2500\u2500\n        let studentName = '';\n        let studentClass = '';\n        function setupGate() {\n            const overlay = document.getElementById('gateOverlay');\n            const nameInp = document.getElementById('gateName');\n            const classInp = document.getElementById('gateClass');\n            const startBtn = document.getElementById('gateStart');\n            const nErr = document.getElementById('nameErr');\n            const cErr = document.getElementById('classErr');\n            function begin() {\n                const n = nameInp.value.trim();\n                const c = classInp.value.trim();\n                let ok = true;\n                if (!n) { nameInp.classList.add('invalid'); nErr.classList.add('show'); ok = false; }\n                else { nameInp.classList.remove('invalid'); nErr.classList.remove('show'); }\n                if (!c) { classInp.classList.add('invalid'); cErr.classList.add('show'); ok = false; }\n                else { classInp.classList.remove('invalid'); cErr.classList.remove('show'); }\n                if (!ok) { (!n ? nameInp : classInp).focus(); return; }\n                studentName = n;\n                studentClass = c;\n                overlay.style.display = 'none';\n                document.body.classList.remove('gated');\n                startTimer();   // start the 25-minute countdown only now\n            }\n            startBtn.addEventListener('click', begin);\n            [nameInp, classInp].forEach(inp => {\n                inp.addEventListener('input', () => { inp.classList.remove('invalid'); inp.parentElement.querySelector('.gate-err').classList.remove('show'); });\n                inp.addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });\n            });\n            nameInp.focus();\n        }\n\n        // Build a readable string of the student's actual answers, e.g.\n        // \"1:C, 2:F, 3:I, ... 7:socialisation, 8:lag, ... 13:thread\" (empty shown as \"-\")\n        function collectAnswers() {\n            const parts = [];\n            for (let i = Q_START; i <= Q_END; i++) {\n                const textEl = document.querySelector(`input[type=\"text\"]#q${i}`);\n                const selEl = document.querySelector(`select#q${i}`);\n                let v = '';\n                if (textEl) v = (textEl.value || '').trim().replace(/\\s+/g, ' ');\n                else if (selEl) v = selEl.value || '';\n                parts.push(i + ':' + (v || '-'));\n            }\n            return parts.join(', ');\n        }\n\n        // Send name, class, answers and score to the Google Form.\n        // no-cors lets a static page post without CORS errors (response is opaque).\n        const GFORM_ID = '1FAIpQLSdt4Mr0Smppz8fUSw8Ju75UCOAnMzCPBGuqqAkCPr_A6RbF-w';\n        function submitToGoogleForm(name, klass, answers, score) {\n            const url = 'https://docs.google.com/forms/d/e/' + GFORM_ID + '/formResponse';\n            const fd = new FormData();\n            fd.append('entry.505069863', name);        // Name\n            fd.append('entry.867517082', klass);       // Class\n            fd.append('entry.1476792905', answers);    // Answers\n            fd.append('entry.1243425858', String(score)); // Score\n            return fetch(url, { method: 'POST', mode: 'no-cors', body: fd }).catch(() => {});\n        }\n\n        window.closeResultsModal = closeResultsModal;\n\n        function initialize() {\n            buildSubQuestions();\n            setupGate();            // require name + class before the test can start\n            updateTimerDisplay();   // show 25:00 but don't start counting until the gate is passed\n            updateAllIndicators();\n            updateNavArrows();\n            resizer.addEventListener('mousedown', initResize);\n            initializeContextMenu();\n            document.body.addEventListener('input', updateAllIndicators);\n            document.body.addEventListener('change', updateAllIndicators);\n            deliverButton.addEventListener('click', checkAnswers);\n            timerToggleButton.addEventListener('click', toggleTimer);\n            timerResetButton.addEventListener('click', resetTimer);\n            document.querySelectorAll('.matching-form-row').forEach(row => {\n                row.addEventListener('click', (e) => {\n                    if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;\n                    const sel = row.querySelector('select');\n                    if (sel) {\n                        const q = parseInt(sel.id.replace('q', ''));\n                        if (currentQuestion !== q) goToQuestion(q);\n                    }\n                });\n            });\n        }\n\n        initialize();\n    }; if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', __runTest); } else { __runTest(); } })();\n    <\/script>\n\n\n<\/body><\/html>"
